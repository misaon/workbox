ls:
  .dir: kebab-case | SCREAMING_SNAKE_CASE
  .ts: kebab-case
  .tsx: kebab-case | PascalCase
  .test.ts: kebab-case
  .test.tsx: kebab-case
  .d.ts: kebab-case
  .md: kebab-case | snake_case | SCREAMING_SNAKE_CASE | regex:\d{4}-\d{2}-\d{2}-R\d{1,2}-[a-z0-9-]+

ignore:
  - .git
  - .github
  - .idea
  - '**/.turbo'
  - '**/.vitest'
  - .superpowers
  - .claude
  - .worktrees
  - '**/node_modules'
  - '**/dist'
  - '**/coverage'
  - '**/paraglide'
  - '**/project.inlang'
