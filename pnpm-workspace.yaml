minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk'
  # remove after 2026-10-01: turbo 2.11.5 and its platform binaries were published on 2026-09-28,
  # so they are younger than minimumReleaseAge (3 days) until then.
  - 'turbo@2.11.5'
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  # remove after 2026-10-01: oxfmt 0.71.0, oxlint 1.86.0 and their platform bindings were published
  # on 2026-09-28, so they are younger than minimumReleaseAge (3 days) until then.
  - 'oxfmt@0.71.0'
  - '@oxfmt/binding-android-arm-eabi@0.71.0'
  - '@oxfmt/binding-android-arm64@0.71.0'
  - '@oxfmt/binding-darwin-arm64@0.71.0'
