name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the release branch and creates the tag and the GitHub release
      pull-requests: write # opens and updates the release pull request
      issues: write # labels the release pull request, as labels belong to the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-binaries:
    name: build-binaries
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # uploads the binaries and the checksums to the GitHub release
      id-token: write # lets actions/attest request a Sigstore signing certificate
      attestations: write # lets actions/attest persist the build provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # no dependency cache here: release artefacts must not be built from a poisonable cache (zizmor cache-poisoning)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          # release builds restore no cache, the Bun executable included
          no-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm run build:binaries
      - name: Checksums
        run: cd apps/cli/dist && sha256sum workbox-* > "workbox_${TAG#v}_checksums.txt"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/cli/dist/workbox-*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" apps/cli/dist/* --clobber
